<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IDE 升级测试系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-text">OTA测试平台</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="/devices" class="nav-link">设备管理</a></li>
            <li class="nav-item"><a href="/monitor" class="nav-link">实时监控</a></li>
            <li class="nav-item"><a href="/tasks" class="nav-link">测试任务</a></li>
            <li class="nav-item"><a href="/records" class="nav-link">历史记录</a></li>
            <li class="nav-item"><a href="/stats" class="nav-link">统计看板</a></li>
            <li class="nav-item"><a href="/settings" class="nav-link">设置</a></li>
        </ul>
    </aside>

    <!-- 内容区域 -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- 全局 JS 工具函数（包含 fetch 封装等通用请求函数） -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
