{% extends "base.html" %}

{% block title %}设备管理 - IDE 升级测试系统{% endblock %}

{% block content %}
<h1 class="page-title">设备管理</h1>

<!-- 添加设备表单 -->
<div class="card">
    <h2 class="card-title">添加设备</h2>
    <form id="addDeviceForm">
        <div class="form-row">
            <div class="form-group">
                <label for="deviceSn">设备 SN</label>
                <input type="text" id="deviceSn" class="form-control" placeholder="请输入设备序列号" required>
            </div>
            <div class="form-group">
                <label for="deviceName">设备名称</label>
                <input type="text" id="deviceName" class="form-control" placeholder="请输入设备名称">
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary">添加设备</button>
            </div>
        </div>
    </form>
    <!-- 环境探测进度 -->
    <div id="probeProgress" style="display:none; margin-top:12px; padding:10px 12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; font-size:13px; color:#475569;">
        <span id="probeProgressText">正在探测...</span>
    </div>
</div>

<!-- 设备列表 -->
<div class="card">
    <h2 class="card-title">设备列表</h2>
    <table class="table" id="deviceTable">
        <thead>
            <tr>
                <th>设备 SN</th>
                <th>设备名称</th>
                <th>当前版本</th>
                <th>所属环境</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="deviceTableBody">
            <!-- 设备数据由 JS 动态填充 -->
        </tbody>
    </table>
    <div class="empty-text" id="emptyTip" style="display:none;">暂无设备数据</div>
</div>

<!-- 版本查看模态框 -->
<div class="modal" id="versionModal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title">设备版本信息</span>
            <button class="modal-close" onclick="hideModal('versionModal')">&times;</button>
        </div>
        <div class="modal-body" id="versionModalBody">
            <!-- 版本信息由 JS 填充 -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    /* ===== 设备管理页面逻辑 ===== */

    // 页面加载时获取设备列表
    document.addEventListener('DOMContentLoaded', loadDevices);

    // 加载设备列表
    function loadDevices() {
        apiGet('/api/devices').then(function(data) {
            var list = data.devices || data || [];
            renderDeviceTable(list);
        }).catch(function(err) {
            showToast('获取设备列表失败: ' + err.message, 'error');
        });
    }

    // 渲染设备表格
    function renderDeviceTable(devices) {
        var tbody = document.getElementById('deviceTableBody');
        var emptyTip = document.getElementById('emptyTip');
        var table = document.getElementById('deviceTable');
        tbody.innerHTML = '';

        if (!devices || devices.length === 0) {
            table.style.display = 'none';
            emptyTip.style.display = 'block';
            return;
        }

        table.style.display = 'table';
        emptyTip.style.display = 'none';

        devices.forEach(function(device) {
            var sn = device.sn || device.serial_number || '';
            var name = device.name || device.device_name || '-';
            var version = device.current_version || device.version || '-';
            var envName = device.env_name || '-';

            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + escapeHtml(sn) + '</td>' +
                '<td>' + escapeHtml(name) + '</td>' +
                '<td>' + escapeHtml(version) + '</td>' +
                '<td>' + escapeHtml(envName) + '</td>' +
                '<td>' +
                '<div class="action-group">' +
                '<button class="btn btn-primary btn-sm" onclick="viewVersion(\'' + sn + '\')">查看版本</button>' +
                '<button class="btn btn-danger btn-sm" onclick="deleteDevice(' + device.id + ', \'' + sn + '\')">删除</button>' +
                '</div>' +
                '</td>';
            tbody.appendChild(tr);
        });
    }

    // 添加设备表单提交
    document.getElementById('addDeviceForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var sn = document.getElementById('deviceSn').value.trim();
        var name = document.getElementById('deviceName').value.trim();

        if (!sn) {
            showToast('请输入设备 SN', 'error');
            return;
        }
        addDeviceWithProbe(sn, name);
    });

    // 进度显示控制
    function showProbeProgress(text) {
        document.getElementById('probeProgressText').textContent = text;
        document.getElementById('probeProgress').style.display = 'block';
    }
    function hideProbeProgress() {
        document.getElementById('probeProgress').style.display = 'none';
    }

    // 添加设备：逐个环境探测（显示进度）后创建，并同步设备列表
    function addDeviceWithProbe(sn, name) {
        var submitBtn = document.querySelector('#addDeviceForm button[type=submit]');
        submitBtn.disabled = true;
        showProbeProgress('正在获取OTA环境列表...');

        apiGet('/api/ota-envs').then(function(data) {
            var envs = (data && data.envs) || [];
            if (envs.length === 0) {
                // 没有配置环境，直接创建
                createDevice(sn, name, null);
                return;
            }
            var idx = 0;
            var foundEnvId = null;
            var foundEnvName = '';

            function probeNext() {
                if (idx >= envs.length) {
                    // 探测完成：找到环境则创建并关联，否则拒绝添加
                    if (foundEnvId) {
                        showProbeProgress('探测完成：设备属于「' + foundEnvName + '」环境，正在添加...');
                        createDevice(sn, name, foundEnvId);
                    } else {
                        hideProbeProgress();
                        submitBtn.disabled = false;
                        showToast('未找到该设备所属的OTA环境，无法添加', 'error');
                    }
                    return;
                }
                var env = envs[idx];
                idx++;
                showProbeProgress('正在探测环境 (' + idx + '/' + envs.length + ')：「' + env.name + '」...');
                apiPost('/api/devices/probe', { sn: sn, env_id: env.id }).then(function(res) {
                    if (res.found && !foundEnvId) {
                        foundEnvId = env.id;
                        foundEnvName = env.name;
                        showProbeProgress('环境 (' + idx + '/' + envs.length + ')：「' + env.name + '」找到设备，版本 ' + (res.version || '') + ' ✓');
                    } else {
                        showProbeProgress('环境 (' + idx + '/' + envs.length + ')：「' + env.name + '」未找到设备');
                    }
                    probeNext();
                }).catch(function() {
                    showProbeProgress('环境 (' + idx + '/' + envs.length + ')：「' + env.name + '」探测失败');
                    probeNext();
                });
            }
            probeNext();
        }).catch(function(err) {
            hideProbeProgress();
            submitBtn.disabled = false;
            showToast('获取环境列表失败: ' + err.message, 'error');
        });
    }

    // 创建设备（可选关联环境），成功后刷新设备列表
    function createDevice(sn, name, envId) {
        var payload = { sn: sn, name: name };
        if (envId) payload.env_id = envId;
        apiPost('/api/devices', payload).then(function() {
            hideProbeProgress();
            document.querySelector('#addDeviceForm button[type=submit]').disabled = false;
            showToast(envId ? '设备添加成功，已关联所属环境' : '设备添加成功', 'success');
            document.getElementById('addDeviceForm').reset();
            loadDevices();
        }).catch(function(err) {
            hideProbeProgress();
            document.querySelector('#addDeviceForm button[type=submit]').disabled = false;
            showToast('添加设备失败: ' + err.message, 'error');
        });
    }

    // 查看当前版本
    function viewVersion(sn) {
        apiGet('/api/devices/' + sn + '/version').then(function(data) {
            var version = data.version || data.current_version || '-';
            var info = data.version_info || data.info || '';
            var html = '<div class="report-section">' +
                '<h4>设备 SN</h4><p>' + escapeHtml(sn) + '</p>' +
                '</div>' +
                '<div class="report-section">' +
                '<h4>当前版本</h4><p>' + escapeHtml(version) + '</p>' +
                '</div>';
            if (info) {
                html += '<div class="report-section"><h4>版本信息</h4><p>' + escapeHtml(info) + '</p></div>';
            }
            document.getElementById('versionModalBody').innerHTML = html;
            showModal('versionModal');
        }).catch(function(err) {
            showToast('获取版本信息失败: ' + err.message, 'error');
        });
    }

    // 删除设备
    function deleteDevice(id, sn) {
        showConfirmDialog({
            title: '删除设备',
            message: '确定要删除设备 ' + sn + ' 吗？'
        }, function(ok) {
            if (!ok) return;
            apiDelete('/api/devices/' + id).then(function() {
                showToast('设备删除成功', 'success');
                loadDevices();
            }).catch(function(err) {
                showToast('删除设备失败: ' + err.message, 'error');
            });
        });
    }

    // HTML 转义工具函数
    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
</script>
{% endblock %}
