<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门锁OTA监控测试平台 - 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f0f2f5; margin:0; }
        .auth-card { background:#fff; padding:40px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); width:360px; }
        .auth-card h2 { text-align:center; margin-bottom:24px; color:#1e293b; }
        .auth-card .form-group { margin-bottom:16px; }
        .auth-card input { width:100%; padding:10px 12px; border:1px solid #e2e8f0; border-radius:6px; font-size:14px; box-sizing:border-box; }
        .auth-card button { width:100%; padding:10px; background:#6366f1; color:#fff; border:none; border-radius:6px; font-size:14px; cursor:pointer; }
        .auth-card button:hover { background:#5457e0; }
        .auth-error { color:#ef4444; text-align:center; margin-top:12px; font-size:14px; display:none; }
        .auth-hint { text-align:center; margin-top:16px; color:#94a3b8; font-size:13px; }
        .auth-switch { text-align:center; margin-top:16px; font-size:14px; color:#64748b; }
        .auth-switch a { color:#6366f1; text-decoration:none; cursor:pointer; }
        .auth-switch a:hover { text-decoration:underline; }
        .hidden { display:none !important; }
    </style>
</head>
<body>
    <!-- 登录表单 -->
    <div class="auth-card" id="loginCard">
        <h2>门锁OTA监控测试平台</h2>
        <div class="form-group">
            <input type="text" id="loginUsername" placeholder="用户名" value="">
        </div>
        <div class="form-group">
            <input type="password" id="loginPassword" placeholder="密码" value="">
        </div>
        <button onclick="doLogin()">登录</button>
        <div class="auth-error" id="loginError"></div>
        <div class="auth-switch">没有账号？<a onclick="showRegister()">注册</a></div>
        <div class="auth-hint">默认账号: admin / admin</div>
    </div>

    <!-- 注册表单 -->
    <div class="auth-card hidden" id="registerCard">
        <h2>注册新账号</h2>
        <div class="form-group">
            <input type="text" id="regUsername" placeholder="用户名" value="">
        </div>
        <div class="form-group">
            <input type="text" id="regDisplayName" placeholder="显示名称（可选）" value="">
        </div>
        <div class="form-group">
            <input type="password" id="regPassword" placeholder="密码（至少6位）" value="">
        </div>
        <div class="form-group">
            <input type="password" id="regPassword2" placeholder="确认密码" value="">
        </div>
        <button onclick="doRegister()">注册</button>
        <div class="auth-error" id="regError"></div>
        <div class="auth-switch">已有账号？<a onclick="showLogin()">返回登录</a></div>
    </div>

    <script>
        function doLogin() {
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value;
            if (!username || !password) { showAuthError('loginError', '请输入用户名和密码'); return; }
            fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:username, password:password}) })
                .then(function(r) { return r.json().then(function(d) { return {ok:r.ok, data:d}; }); })
                .then(function(res) {
                    if (res.ok) { window.location.href = '/'; }
                    else { showAuthError('loginError', res.data.error || '登录失败'); }
                })
                .catch(function() { showAuthError('loginError', '网络错误'); });
        }

        function doRegister() {
            var username = document.getElementById('regUsername').value.trim();
            var displayName = document.getElementById('regDisplayName').value.trim();
            var password = document.getElementById('regPassword').value;
            var password2 = document.getElementById('regPassword2').value;

            if (!username || !password) { showAuthError('regError', '用户名和密码不能为空'); return; }
            if (password.length < 6) { showAuthError('regError', '密码至少6个字符'); return; }
            if (password !== password2) { showAuthError('regError', '两次输入的密码不一致'); return; }

            fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:username, password:password, display_name:displayName}) })
                .then(function(r) { return r.json().then(function(d) { return {ok:r.ok, data:d}; }); })
                .then(function(res) {
                    if (res.ok) { window.location.href = '/'; }
                    else { showAuthError('regError', res.data.error || '注册失败'); }
                })
                .catch(function() { showAuthError('regError', '网络错误'); });
        }

        function showRegister() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('registerCard').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('registerCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
        }

        function showAuthError(id, msg) {
            var el = document.getElementById(id);
            el.style.display = 'block';
            el.textContent = msg;
        }

        document.getElementById('loginPassword').addEventListener('keypress', function(e) { if (e.key==='Enter') doLogin(); });
        document.getElementById('regPassword2').addEventListener('keypress', function(e) { if (e.key==='Enter') doRegister(); });
    </script>
</body>
</html>
